<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form submission</title>


</head>

<body>

<h2>Let's learn about Form submission</h2>

<form>

<fieldset>

<label>Name</label>

<input type="text"> <br> <br>

<label>Email ID</label>

<input type="email"> <br> <br>

<label>Contact Number</label>

<input type="number"> <br> <br>

<label>Password</label>

<input type="password">

<br><br>

<label>Date of Birth</label>

<input type="date"> <br> <br>

<label>Gender</label>

<br>

<input type="radio" name="gender" value="male"> Male

<br>

<input type="radio" name="gender" value="female"> Female

<br><br>

<label><b>Favourite sports</b></label>

<br>

<input type="checkbox" value="football">Football <br>

<input type="checkbox" value="cricket">Cricket <br>

<input type="checkbox" value="volleyball">Volleyball <br>

<input type="checkbox" value="tabletennis">Table Tennis <br>

<br><br><br>

<button type="submit">Submit</button>

</fieldset>


</form>

</body>

</html>
